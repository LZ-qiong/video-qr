<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>视频播放 · 扫码入口</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { min-height: 100vh; background: #0b0f14; color: #e8f1f4;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 28px 18px; }
  h1 { font-size: 19px; font-weight: 800; letter-spacing: 1px; }
  p.sub { font-size: 12.5px; color: #8fb0bd; margin-bottom: 8px; text-align: center; line-height: 1.7; }
  a.card {
    width: 100%; max-width: 420px; display: flex; align-items: center; gap: 14px;
    padding: 18px 20px; border-radius: 14px; text-decoration: none; color: inherit;
    background: #121a22; border: 1px solid #1e2b36; transition: transform .15s, border-color .15s;
  }
  a.card:active { transform: scale(.98); border-color: #12a4b0; }
  .badge { flex: none; width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, #12a4b0, #0a5a63); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; }
  .meta h2 { font-size: 15px; font-weight: 700; }
  .meta span { font-size: 11.5px; color: #8fb0bd; }
</style>
</head>
<body>
  <h1>视频播放</h1>
  <p class="sub">点击下方卡片直接播放<br>或使用对应的二维码扫码观看</p>
  <a class="card" href="v1/">
    <div class="badge">1</div>
    <div class="meta"><h2>视频一</h2><span>点击播放 · 支持全屏</span></div>
  </a>
  <a class="card" href="v2/">
    <div class="badge">2</div>
    <div class="meta"><h2>视频二</h2><span>点击播放 · 支持全屏</span></div>
  </a>
</body>
</html>
